function getRoute(){const raw=location.hash.slice(1)||'home';const [page,...args]=raw.split('/');return{page,arg:decodeURIComponent(args.join('/'))};}
function referenceArtwork(){return `<svg class="hero-art" viewBox="0 0 240 240" aria-hidden="true"><defs><filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6c6a88" flood-opacity=".09"/></filter></defs><g fill="none" stroke="#e6e7ed" stroke-width="1.2"><path d="M47 64h75q15 0 15 15v72q0 15 15 15h39M47 176h40q15 0 15-15v-55q0-15 15-15h77"/><circle cx="47" cy="64" r="3" fill="white"/><circle cx="47" cy="176" r="3" fill="white"/></g><g filter="url(#soft-shadow)"><rect x="72" y="74" width="95" height="80" rx="17" fill="white" stroke="#ececf2"/><rect x="84" y="86" width="71" height="43" rx="9" fill="#eef3ff"/><path d="m104 100-7 6 7 6m29-12 7 6-7 6m-12-15-5 18" stroke="#91a8df" stroke-width="2.3" fill="none"/><rect x="85" y="139" width="31" height="3" rx="1.5" fill="#e2e6ef"/><rect x="121" y="139" width="17" height="3" rx="1.5" fill="#eceef4"/><rect x="28" y="40" width="49" height="49" rx="15" fill="white" stroke="#eeeeF2"/><rect x="36" y="48" width="33" height="33" rx="10" fill="#e4f7ef"/><path d="m44 65 5 5 10-11" stroke="#8cc5b1" stroke-width="2" fill="none"/><rect x="167" y="145" width="50" height="50" rx="16" fill="white" stroke="#eeeeF2"/><rect x="175" y="153" width="34" height="34" rx="11" fill="#faeaf1"/><path d="M183 164h18m-18 6h18m-18 6h10" stroke="#d3a6bb" stroke-width="2" fill="none"/><circle cx="194" cy="72" r="20" fill="white" stroke="#eeeeF2"/><path d="M187 72h14m-7-7v14" stroke="#b5b0dd" stroke-width="2"/></g><g fill="#e4e6ef" stroke="none"><circle cx="56" cy="133" r="2"/><circle cx="153" cy="41" r="2"/><circle cx="143" cy="199" r="2"/></g></svg>`;}
function artwork(){if(variant==='A')return referenceArtwork();return `<svg class="hero-art" viewBox="0 0 230 240" aria-hidden="true"><g stroke="#99bca5" stroke-width="1" fill="none"><path d="M18 159h39V71h70v98h68M128 96h59v35M58 116h38M128 169v37"/><circle cx="18" cy="159" r="4" fill="#d2e3cd"/><circle cx="187" cy="131" r="5" fill="#efac90"/><circle cx="128" cy="206" r="4" fill="#c1d6be"/><path d="M174 39v16m-8-8h16M25 58v10m-5-5h10"/></g><rect x="68" y="81" width="95" height="78" rx="12" fill="#d5e6d2" stroke="#bad2bb" stroke-width="1"/><rect x="79" y="92" width="73" height="54" rx="6" fill="#235b4b" stroke="none"/><g stroke="#b6d5b9" stroke-width="2.5" fill="none"><path d="m95 109-7 6 7 6m37-12 7 6-7 6m-13-15-6 18"/></g><circle cx="174" cy="174" r="23" fill="#f3c2a7" stroke="none"/><path d="m164 174 7 7 13-14" fill="none" stroke="#975e43" stroke-width="2"/><circle cx="53" cy="60" r="10" fill="#bed6b9" stroke="none"/><path d="M42 184h34M42 191h21" fill="none" stroke="#98b59a" stroke-width="2"/></svg>`;}
function sidebar(){let {page}=getRoute();document.getElementById('sidebar').innerHTML=`<a href="#home" class="brand"><span class="logo">b.</span><span>技术与思考</span></a><div class="profile"><div class="avatar"><img src="assets/starship.jpg" alt="SpaceX 星舰" width="67" height="67"></div><h2>Bo</h2><p class="profile-motto">Stay hungry, Stay foolish.</p></div><nav class="nav" aria-label="主导航">${navs.map(([key,icon,label])=>`<a href="#${key}" class="${page===key||key==='home'&&['article','filter','search'].includes(page)?'active':''}">${svg(icon)}<span>${label}</span></a>`).join('')}</nav><div class="side-bottom"><span>EST. 2026</span><span>本地设计原型</span></div>`;}
function aside(article=false){document.getElementById('right').innerHTML=article?`<div class="aside-block toc"><h2 class="aside-title">${svg('book')}本文目录</h2><a href="#article/${currentPost().id}" data-anchor="section-1">01 · 从一个具体问题开始</a><a href="#article/${currentPost().id}" data-anchor="section-2">02 · 让依赖变小</a><a href="#article/${currentPost().id}" data-anchor="section-3">03 · 留给下一次实践</a></div><div class="note">先把问题描述清楚，再决定需要怎样的抽象。<small>写给自己的提醒</small></div>`:`<div class="aside-block"><h2 class="aside-title">${svg('leaf')}关于这片小天地</h2><p class="intro">记录开发中的问题与答案，<br>也留下一些尚在形成的想法。<br><strong>认真做事，坦诚记录。</strong></p><div class="stats"><div><b>06</b><span>篇演示文章</span></div><div><b>04</b><span>个思考方向</span></div></div></div><div class="aside-block"><h2 class="aside-title">${svg('grid')}探索专题</h2>${cats.map(c=>`<a class="topic" href="#filter/${encodeURIComponent(c)}">${c}<span>${posts.filter(p=>p.category===c).length}</span></a>`).join('')}</div><div class="aside-block"><h2 class="aside-title">${svg('tag')}常用标签</h2><div class="tag-cloud">${allTags.slice(0,9).map(t=>`<button data-filter="${esc(t)}">${t}</button>`).join('')}</div></div><div class="note">把想法写下来，<br>是认真思考的开始。<small>一些写给未来自己的笔记</small></div>`;}
function card(p){return `<a class="post" href="#article/${p.id}"><div class="post-top"><span class="category">${p.category}</span>${p.pin?'<span class="pin">置顶文章</span>':''}</div><h3>${p.title}</h3><p>${p.desc}</p><div class="meta"><span class="date">${svg('calendar')}${p.date.replaceAll('-','.')}</span><span>·</span><span>${p.minutes} 分钟阅读</span><span class="tags">${p.tags.map(t=>'# '+t).join('　')}</span></div></a>`;}
function currentPost(){return posts.find(p=>p.id===getRoute().arg)||posts[0]}
function article(p){return `<a class="back" href="#home">${svg('back')}返回文章列表</a><article class="article"><span class="category">${p.category}</span><h1>${p.title}</h1><div class="meta"><span>Bo</span><span>·</span><time>${p.date.replaceAll('-','.')}</time><span>·</span><span>${p.minutes} 分钟阅读</span></div><p class="lead">${p.desc}</p><div class="article-body"><p>最近的一次实践，让我又回头看了看这个问题。很多设计在刚开始时显得理所当然，直到新的需求出现，我们才有机会检验原来的判断。</p><h2 id="section-1">从一个具体问题开始</h2><p>${p.id==='boundaries'?'项目里有一个很大的 Repository 接口。一个只需要读取用户信息的服务，却依赖了十几个完全用不到的方法。每次写测试，都需要为这些方法准备替身。':'排查时，我先把问题放回具体的请求中：数据在什么时候产生，谁在读取它，失败又会怎样影响用户？这些问题帮助我缩小了需要关注的范围。'}</p><blockquote>如果一段抽象让使用它的人需要了解更多细节，就值得停下来重新看一遍。</blockquote><p>于是，我尝试从调用方真正需要的行为出发，先写下最小的依赖。下面用一个读取用户的例子说明。</p><h2 id="section-2">让依赖变小</h2><div class="code-wrap"><header><span>GO · 一个最小的读取接口</span><button id="copy">复制代码</button></header><pre id="code"><span class="cm">// 在使用方定义它真正需要的行为</span>
<span class="kw">type</span> UserReader <span class="kw">interface</span> {
  FindByID(ctx context.Context, id int64) (*User, error)
}

<span class="kw">type</span> Service <span class="kw">struct</span> {
  users UserReader
}</pre></div><p>这样的改变很小，却让调用方的需求变得明确。测试只需提供读取行为，后续替换存储实现时，也更容易判断哪些地方会受到影响。</p><p>当然，这只是当前约束下的一个选择。接口太细也会增加理解成本，需要在后续使用中继续调整。</p><h2 id="section-3">留给下一次实践</h2><p>我想继续观察：同一段设计被第二个调用方使用时，原来的边界是否仍然合适？先记下判断的依据，再用实际变化验证它。</p><p>写下这些，也是在提醒未来的自己：保留问题的上下文，往往和保留答案同样有用。</p></div><div class="tag-end">${p.tags.map(t=>'# '+t).join('　')}<p>本文为原型演示内容，用于预览中文排版、代码块和目录效果。</p></div></article>`;}
function render(){let{page,arg}=getRoute();document.body.className=`variant-${variant.toLowerCase()}${dark?' dark':''}`;sidebar();aside(page==='article');document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('selected',b.dataset.variant===variant);b.setAttribute('aria-pressed',String(b.dataset.variant===variant))});document.getElementById('crumb').innerHTML=`${svg('home')}<a href="#home">首页</a>${page!=='home'?`<span>/</span><span>${names[page]||'首页'}</span>`:''}`;document.getElementById('theme').innerHTML=svg(dark?'sun':'moon');const main=document.getElementById('main');
if(page==='article'){main.innerHTML=article(currentPost());document.title=currentPost().title+' · Bo';return}
document.title='Bo · 技术与思考';
if(page==='categories'){main.innerHTML=`<h1 class="page-heading">按专题，慢慢积累。</h1><p class="subheading">同一个问题，在不同的实践中会有新的理解。</p><div class="collection">${cats.map((c,i)=>`<button data-filter="${c}"><span class="eyebrow">0${i+1} / TOPIC</span><b>${c}</b><small>${posts.filter(p=>p.category===c).length} 篇演示文章　↗</small></button>`).join('')}</div>`;return}
if(page==='tags'){main.innerHTML=`<h1 class="page-heading">从一个关键词开始。</h1><p class="subheading">连接零散的想法，也发现反复出现的问题。</p><div class="tag-cloud">${allTags.map(t=>`<button data-filter="${t}" style="font-size:15px;padding:12px 18px"># ${t} <small> ${posts.filter(p=>p.tags.includes(t)).length}</small></button>`).join('')}</div>`;return}
if(page==='archives'){main.innerHTML=`<h1 class="page-heading">写作的足迹</h1><p class="subheading">每一篇，都是当时的一个思考切片。</p><div class="archive-year">2026 <span class="category">/ 06 篇</span></div>${posts.map(p=>`<a class="archive-row" href="#article/${p.id}"><time>${p.date.slice(5).replace('-',' / ')}</time><span>${p.title}</span></a>`).join('')}`;return}
if(page==='about'){main.innerHTML=`<article class="article"><span class="eyebrow">A LITTLE ABOUT ME</span><h1>你好，我是Bo。</h1><p class="lead">一名喜欢把问题想清楚的程序员。</p><div class="article-body"><p>这里用来记录技术实践中的经验、疑问和思考。写代码之外，我也希望能把做过的选择和走过的弯路留下来。</p><h2>我会在这里写些什么</h2><p>编程与设计、系统与架构、工程实践，以及工作中的成长与复盘。</p><blockquote>允许想法不成熟，也允许未来的自己有不同的答案。</blockquote><p>这是一份博客设计原型。姓名、简介和所有文章都可以在正式建站时替换。</p></div></article>`;return}
let list=posts;if(page==='filter')list=posts.filter(p=>p.category===arg||p.tags.includes(arg));else if(page==='search')list=posts.filter(p=>(p.title+p.desc+p.category+p.tags.join(' ')).toLowerCase().includes(query.toLowerCase()));else if(activeFilter!=='全部')list=posts.filter(p=>p.category===activeFilter);
main.innerHTML=(page==='home'?`<section class="hero"><div class="eyebrow"><span class="dot"></span>A DEVELOPER'S JOURNAL</div><h1>把问题想清楚，<br>把经验写下来。</h1>${artwork()}</section>`:`<h1 class="page-heading">${page==='search'?'搜索结果':esc(arg)}</h1><p class="subheading">${page==='search'?'查找与「'+esc(query)+'」有关的文章':'一些围绕同一主题的实践与思考。'}</p>`)+`<div class="section-head"><h2>${page==='home'?'最近的思考':'相关文章'}</h2><small>${String(list.length).padStart(2,'0')} ARTICLES</small></div>${page==='home'?`<div class="filterbar">${['全部',...cats].map(c=>`<button class="chip ${activeFilter===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>`:''}<div class="posts">${list.length?list.map(card).join(''):'<div class="empty">还没有找到相关文章，换个关键词试试。</div>'}</div>`;}
function setVariant(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]');if(v)setVariant(v.dataset.variant);const step=e.target.closest('[data-step]');if(step)setVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+Number(step.dataset.step)+3)%3]);const filter=e.target.closest('[data-filter]');if(filter){document.getElementById('search').value='';location.hash='filter/'+encodeURIComponent(filter.dataset.filter)}const cat=e.target.closest('[data-cat]');if(cat){activeFilter=cat.dataset.cat;render()}const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor).scrollIntoView({behavior:'smooth'})}if(e.target.closest('#copy')){const text=document.getElementById('code').innerText;const btn=e.target.closest('#copy');if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>{btn.textContent='已复制'}).catch(()=>{btn.textContent='请选中代码复制'});else btn.textContent='请选中代码复制'}if(e.target.closest('.nav a,.brand'))document.getElementById('sidebar').classList.remove('open')});
document.getElementById('search-icon').innerHTML=svg('search');document.getElementById('menu').innerHTML=svg('menu');document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').onclick=()=>document.getElementById('sidebar').classList.remove('open');document.getElementById('theme').onclick=()=>{dark=!dark;render()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();const next=query?'#search':'#home';if(location.hash===next)render();else location.hash=next});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='/'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+(e.key==='ArrowRight'?1:2))%3])}if(e.key==='Escape')document.getElementById('sidebar').classList.remove('open')});render();
</script>
</body>
</html>
