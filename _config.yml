theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai
title: Bo
tagline: Stay hungry, Stay foolish.
description: 记录程序员生涯中的技术实践、问题与思考。
url: https://profoundwu.github.io
baseurl: ""
github:
  username: profoundwu
social:
  name: Bo
  links:
    - https://github.com/profoundwu
avatar: /assets/img/starship.jpg
social_preview_image: /assets/img/starship.jpg
theme_mode: light
toc: true
comments:
  provider: ""
assets:
  self_host:
    enabled: true
pwa:
  enabled: false
paginate: 10
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  blanklines: false
  ignore:
    envs: [development]
exclude:
  - docs
  - prototype
  - tools
  - vendor
  - Dockerfile
  - compose.yaml
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
